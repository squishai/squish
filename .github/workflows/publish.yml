name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write      # needed to create a GitHub Release
  id-token: write      # needed for OIDC Trusted Publisher upload

jobs:
  build-and-publish:
    name: Build & upload to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify distribution
        run: pip install twine && twine check dist/*

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # release.yml's own publish-pypi job (triggered by the push to main
          # that bumped pyproject.toml) races this tag-push-triggered job and
          # almost always finishes first, since it skips the twine check step
          # above. Without skip_existing, PyPI's "file already exists" 400
          # from that redundant upload fails this step — which then skips
          # "Create GitHub Release" below, so no release notes ever get
          # written. skip_existing makes the redundant upload a no-op instead
          # of a failure, matching release.yml's own publish step.
          skip_existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: The Homebrew formula is NOT updated here. release.yml's own
      # update-formula job (triggered by the push to main that bumped
      # pyproject.toml, which is what created this tag in the first place)
      # already does that authoritatively — it reads the real CDN url/sha256
      # from PyPI's JSON API and bumps the `squish_ai` wheel resource block
      # that `brew` actually installs from, not just the headline sdist url.
      # A second, cruder update from this tag-triggered job used to race it:
      # this job checks out the tag (detached HEAD), so its formula commit
      # had no branch to push to, and rebasing onto origin/main hit a real
      # conflict — the two jobs compute textually different (if equivalent)
      # PyPI urls for the same release, so the "identical change" no-op the
      # rebase was relying on never happened. See #228.
